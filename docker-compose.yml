version: '3.8'

services:
  # ======================
  # 1. INFRASTRUCTURE LAYER
  # ======================
  
  # Zookeeper - Kafka coordination
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    hostname: zookeeper
    container_name: zookeeper
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    volumes:
      - zookeeper-data:/var/lib/zookeeper/data
      - zookeeper-logs:/var/lib/zookeeper/log
    networks:
      - bigdata-network
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "2181"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Kafka Broker
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    hostname: kafka
    container_name: kafka
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"
      - "19092:19092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: 'zookeeper:2181'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:19092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
      KAFKA_LOG_RETENTION_HOURS: 168
    volumes:
      - kafka-data:/var/lib/kafka/data
    networks:
      - bigdata-network
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 10s
      timeout: 10s
      retries: 5

  # Kafka UI for monitoring
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: bigdata-local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      KAFKA_CLUSTERS_0_ZOOKEEPER: zookeeper:2181
    networks:
      - bigdata-network

  # ======================
  # HADOOP HDFS CLUSTER
  # ======================
  
  # Hadoop NameNode - HDFS Master (metadata management)
  hadoop-namenode:
    image: bde2020/hadoop-namenode:2.0.0-hadoop3.2.1-java8
    container_name: hadoop-namenode
    hostname: hadoop-namenode
    ports:
      - "9870:9870"  # HDFS Web UI
      - "9000:9000"  # HDFS API
    environment:
      - CLUSTER_NAME=bigdata-cluster
      - CORE_CONF_fs_defaultFS=hdfs://hadoop-namenode:9000
      - CORE_CONF_hadoop_http_staticuser_user=root
      - CORE_CONF_hadoop_proxyuser_hue_hosts=*
      - CORE_CONF_hadoop_proxyuser_hue_groups=*
      - HDFS_CONF_dfs_webhdfs_enabled=true
      - HDFS_CONF_dfs_permissions_enabled=false
      - HDFS_CONF_dfs_namenode_datanode_registration_ip___hostname___check=false
    volumes:
      - hadoop-namenode:/hadoop/dfs/name
    networks:
      - bigdata-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9870"]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped

  # Hadoop DataNode - HDFS Worker (data storage)
  hadoop-datanode:
    image: bde2020/hadoop-datanode:2.0.0-hadoop3.2.1-java8
    container_name: hadoop-datanode
    hostname: hadoop-datanode
    depends_on:
      hadoop-namenode:
        condition: service_healthy
    environment:
      - CORE_CONF_fs_defaultFS=hdfs://hadoop-namenode:9000
      - CORE_CONF_hadoop_http_staticuser_user=root
      - HDFS_CONF_dfs_webhdfs_enabled=true
      - HDFS_CONF_dfs_permissions_enabled=false
      - HDFS_CONF_dfs_datanode_data_dir=file:///hadoop/dfs/data
    volumes:
      - hadoop-datanode:/hadoop/dfs/data
    networks:
      - bigdata-network
    restart: unless-stopped

  # Elasticsearch - Data storage and search
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.13.2
    container_name: elasticsearch
    ports:
      - "9200:9200"
      - "9300:9300"
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
      - bootstrap.memory_lock=true
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - es-data:/usr/share/elasticsearch/data
    networks:
      - bigdata-network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Kibana - Elasticsearch visualization
  kibana:
    image: docker.elastic.co/kibana/kibana:8.13.2
    container_name: kibana
    depends_on:
      elasticsearch:
        condition: service_healthy
    ports:
      - "5601:5601"
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
    networks:
      - bigdata-network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5601/api/status || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5

  # ======================
  # 2. DATA PROCESSING LAYER
  # ======================

  # Kafka to Elasticsearch Consumer - Speed Layer (Real-time)
  kafka-to-es-consumer:
    build:
      context: ./spark
      dockerfile: consumer.Dockerfile
    container_name: kafka-to-es-consumer
    depends_on:
      kafka:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      ES_HOST: http://elasticsearch:9200
      PYTHONUNBUFFERED: 1
    networks:
      - bigdata-network
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Kafka to HDFS Consumer - Save raw data to HDFS
  kafka-to-hdfs:
    build:
      context: ./hdfs
      dockerfile: Dockerfile
    container_name: kafka-to-hdfs
    depends_on:
      kafka:
        condition: service_healthy
      hadoop-namenode:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_TOPIC: crypto-raw
      HDFS_NAMENODE_URL: http://hadoop-namenode:9870
      HDFS_DATA_DIR: /data
    networks:
      - bigdata-network
    restart: unless-stopped

  # Crawler - Collect crypto data
  crawler:
    build:
      context: ./crawl
      dockerfile: Dockerfile
    container_name: crypto-crawler
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_TOPIC: crypto-raw
      CRAWL_INTERVAL: 300
      CRYPTOCOMPARE_API_KEY: ${CRYPTOCOMPARE_API_KEY:-demo}
    networks:
      - bigdata-network
    restart: unless-stopped

  # Spark Master - Processing coordination
  spark-master:
    build:
      context: ./spark
      dockerfile: Dockerfile
    container_name: spark-master
    ports:
      - "8081:8080"
      - "7077:7077"
    environment:
      - SPARK_MODE=master
      - SPARK_RPC_AUTHENTICATION_ENABLED=no
      - SPARK_RPC_ENCRYPTION_ENABLED=no
      - SPARK_LOCAL_STORAGE_ENCRYPTION_ENABLED=no
      - SPARK_SSL_ENABLED=no
    networks:
      - bigdata-network
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.master.Master

  # Spark Worker - Processing execution
  spark-worker:
    build:
      context: ./spark
      dockerfile: Dockerfile
    container_name: spark-worker
    depends_on:
      - spark-master
    environment:
      - SPARK_MODE=worker
      - SPARK_MASTER_URL=spark://spark-master:7077
      - SPARK_WORKER_MEMORY=2G
      - SPARK_WORKER_CORES=2
      - SPARK_RPC_AUTHENTICATION_ENABLED=no
      - SPARK_RPC_ENCRYPTION_ENABLED=no
      - SPARK_LOCAL_STORAGE_ENCRYPTION_ENABLED=no
      - SPARK_SSL_ENABLED=no
    networks:
      - bigdata-network
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker spark://spark-master:7077

  # Spark Batch Processing - Process HDFS data every 5 minutes
  spark-batch:
    build:
      context: ./spark
      dockerfile: Dockerfile
    container_name: spark-batch
    depends_on:
      kafka-to-hdfs:
        condition: service_started
      hadoop-namenode:
        condition: service_healthy
    environment:
      HDFS_NAMENODE_URL: hdfs://hadoop-namenode:9000
      HDFS_DATA_DIR: hdfs://hadoop-namenode:9000/data
      PYTHONUNBUFFERED: 1
    volumes:
      - ./spark:/app
    networks:
      - bigdata-network
    command: bash -c "chmod +x /app/run_batch_loop.sh && /app/run_batch_loop.sh"
    restart: unless-stopped

  # Data Cleaning Job - Run once for testing
  data-cleaning:
    build:
      context: ./spark
      dockerfile: batch.Dockerfile
    container_name: data-cleaning
    depends_on:
      kafka-to-hdfs:
        condition: service_started
      hadoop-namenode:
        condition: service_healthy
    environment:
      HDFS_NAMENODE_URL: hdfs://hadoop-namenode:9000
      HDFS_DATA_DIR: hdfs://hadoop-namenode:9000/data
      PYTHONUNBUFFERED: 1
    networks:
      - bigdata-network
    command: python3 /app/data_cleaning.py

  # Daily Aggregation Job - Run once for testing
  daily-aggregation:
    build:
      context: ./spark
      dockerfile: batch.Dockerfile
    container_name: daily-aggregation
    depends_on:
      data-cleaning:
        condition: service_started
      hadoop-namenode:
        condition: service_healthy
    environment:
      HDFS_NAMENODE_URL: hdfs://hadoop-namenode:9000
      HDFS_DATA_DIR: hdfs://hadoop-namenode:9000/data
      PYTHONUNBUFFERED: 1
    networks:
      - bigdata-network
    command: python3 /app/daily_aggregation.py

  # Spark to Elasticsearch - Index processed data
  spark-to-es:
    build:
      context: ./spark
      dockerfile: Dockerfile
    container_name: spark-to-es
    depends_on:
      elasticsearch:
        condition: service_healthy
      spark-batch:
        condition: service_started
      hadoop-namenode:
        condition: service_healthy
    environment:
      ES_HOST: http://elasticsearch:9200
      HDFS_NAMENODE_URL: hdfs://hadoop-namenode:9000
      HDFS_DATA_DIR: hdfs://hadoop-namenode:9000/data
      PYTHONUNBUFFERED: 1
    volumes:
      - ./spark:/app
    networks:
      - bigdata-network
    command: bash -c "sleep 30 && while true; do echo '⏰ Running ES indexing...'; /opt/spark/bin/spark-submit /app/spark_to_elasticsearch.py --all; echo '✅ Indexing complete, sleeping 2 minutes...'; sleep 120; done"
    restart: unless-stopped

  # CoinGecko Streaming Crawler - send data to Kafka every minute
  crawler-streaming:
    build:
      context: ./crawl
      dockerfile: Dockerfile
    container_name: crawler-streaming
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_TOPIC: crypto-raw
      CRAWL_INTERVAL_SECONDS: 60
      PYTHONUNBUFFERED: 1
    volumes:
      - ./crawl:/app
    networks:
      - bigdata-network
    # Use the image's default CMD (streaming crawler)
  # Spark Streaming - Kafka to Elasticsearch (disabled, using batch)
  spark-streaming:
    build:
      context: ./spark
      dockerfile: Dockerfile
    container_name: spark-streaming
    depends_on:
      kafka:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      spark-master:
        condition: service_started
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_TOPIC: crypto-raw
      ELASTICSEARCH_HOST: elasticsearch
      ELASTICSEARCH_PORT: 9200
      ELASTICSEARCH_INDEX: crypto-data
    volumes:
      - ./spark:/app
    networks:
      - bigdata-network
    command: >
      /opt/spark/bin/spark-submit
      --master spark://spark-master:7077
      --packages org.apache.spark:spark-sql-kafka-0-10_2.12:3.4.1
      /app/streaming_processing.py
    restart: unless-stopped

  # ======================
  # 3. API LAYER
  # ======================

  # Query API - REST API for querying data
  query-api:
    build:
      context: ./elasticsearch
      dockerfile: Dockerfile
    container_name: query-api
    depends_on:
      elasticsearch:
        condition: service_healthy
    ports:
      - "8000:8000"
    environment:
      ES_HOST: http://elasticsearch:9200
      ELASTICSEARCH_HOST: elasticsearch
      ELASTICSEARCH_PORT: 9200
      ELASTICSEARCH_INDEX: crypto-data
    networks:
      - bigdata-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  # ======================
  # 6. DATABASE LAYER
  # ======================

  # PostgreSQL - Store aggregated metrics for API/UI
  postgres:
    image: postgres:15-alpine
    container_name: postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: crypto_analytics
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - bigdata-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # pgAdmin - PostgreSQL Web UI
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: pgadmin
    ports:
      - "5050:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    volumes:
      - pgadmin-data:/var/lib/pgadmin
    networks:
      - bigdata-network
    depends_on:
      - postgres

  # Unified Export - Export to PostgreSQL + Elasticsearch
  export-metrics:
    build:
      context: ./spark
      dockerfile: batch.Dockerfile
    container_name: export-metrics
    depends_on:
      postgres:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      hadoop-namenode:
        condition: service_healthy
    environment:
      HDFS_DATA_DIR: hdfs://hadoop-namenode:9000/data
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: crypto_analytics
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      ES_NODES: elasticsearch
      ES_PORT: 9200
      PYTHONUNBUFFERED: 1
    networks:
      - bigdata-network
    command: python3 /app/export_metrics.py

volumes:
  zookeeper-data:
    driver: local
  zookeeper-logs:
    driver: local
  kafka-data:
    driver: local
  es-data:
    driver: local
  hadoop-namenode:
    driver: local
  hadoop-datanode:
    driver: local
  postgres-data:
    driver: local
  pgadmin-data:
    driver: local

networks:
  bigdata-network:
    driver: bridge
