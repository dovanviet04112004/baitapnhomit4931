# FastAPI Query Service Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: query-api
  namespace: crypto-pipeline
  labels:
    app: query-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: query-api
  template:
    metadata:
      labels:
        app: query-api
    spec:
      containers:
      - name: api
        image: python:3.11-slim
        ports:
        - containerPort: 8000
          name: http
        command:
        - /bin/bash
        - -c
        - |
          pip install fastapi uvicorn requests --quiet
          python /app/query_api.py
        env:
        - name: ES_HOST
          value: "http://elasticsearch:9200"
        volumeMounts:
        - name: api-code
          mountPath: /app
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        readinessProbe:
          httpGet:
            path: /docs
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 10
      volumes:
      - name: api-code
        configMap:
          name: query-api-code
---
apiVersion: v1
kind: Service
metadata:
  name: query-api
  namespace: crypto-pipeline
  labels:
    app: query-api
spec:
  type: NodePort
  ports:
  - port: 8000
    targetPort: 8000
    nodePort: 30800
    name: http
  selector:
    app: query-api
---
# ConfigMap chứa FastAPI code
apiVersion: v1
kind: ConfigMap
metadata:
  name: query-api-code
  namespace: crypto-pipeline
data:
  query_api.py: |
    import os
    from fastapi import FastAPI, HTTPException
    from fastapi.middleware.cors import CORSMiddleware
    import requests

    app = FastAPI(
        title="Crypto Analytics API",
        description="REST API for Crypto Analytics Pipeline",
        version="1.0.0"
    )

    app.add_middleware(
        CORSMiddleware,
        allow_origins=["*"],
        allow_methods=["*"],
        allow_headers=["*"],
    )

    ES_HOST = os.environ.get("ES_HOST", "http://elasticsearch:9200")

    def es_query(index, query):
        """Execute Elasticsearch query"""
        try:
            response = requests.post(
                f"{ES_HOST}/{index}/_search",
                json=query,
                headers={"Content-Type": "application/json"}
            )
            return response.json()
        except Exception as e:
            raise HTTPException(status_code=500, detail=str(e))

    @app.get("/")
    def root():
        return {"message": "Crypto Analytics API", "status": "running"}

    @app.get("/health")
    def health():
        try:
            r = requests.get(f"{ES_HOST}/_cluster/health")
            return {"api": "healthy", "elasticsearch": r.json().get("status")}
        except:
            return {"api": "healthy", "elasticsearch": "unavailable"}

    @app.get("/api/market/summary")
    def market_summary():
        """Get market summary"""
        query = {
            "size": 0,
            "aggs": {
                "total_market_cap": {"sum": {"field": "market_cap"}},
                "total_volume": {"sum": {"field": "volume_24h"}},
                "avg_change": {"avg": {"field": "percent_change_24h"}},
                "coin_count": {"value_count": {"field": "symbol"}}
            }
        }
        result = es_query("crypto_latest", query)
        aggs = result.get("aggregations", {})
        return {
            "total_market_cap": aggs.get("total_market_cap", {}).get("value", 0),
            "total_volume_24h": aggs.get("total_volume", {}).get("value", 0),
            "avg_change_24h": aggs.get("avg_change", {}).get("value", 0),
            "coin_count": aggs.get("coin_count", {}).get("value", 0)
        }

    @app.get("/api/coins")
    def list_coins(limit: int = 100, min_market_cap: float = 0):
        """List all coins"""
        query = {
            "size": limit,
            "query": {"range": {"market_cap": {"gte": min_market_cap}}},
            "sort": [{"market_cap": "desc"}]
        }
        result = es_query("crypto_latest", query)
        hits = result.get("hits", {}).get("hits", [])
        return [hit["_source"] for hit in hits]

    @app.get("/api/coins/{symbol}")
    def get_coin(symbol: str):
        """Get coin by symbol"""
        query = {"query": {"term": {"symbol": symbol.upper()}}}
        result = es_query("crypto_latest", query)
        hits = result.get("hits", {}).get("hits", [])
        if not hits:
            raise HTTPException(status_code=404, detail="Coin not found")
        return hits[0]["_source"]

    @app.get("/api/rankings/gainers")
    def top_gainers(limit: int = 10):
        """Get top gainers"""
        query = {
            "size": limit,
            "sort": [{"percent_change_24h": "desc"}]
        }
        result = es_query("crypto_latest", query)
        hits = result.get("hits", {}).get("hits", [])
        return [hit["_source"] for hit in hits]

    @app.get("/api/rankings/losers")
    def top_losers(limit: int = 10):
        """Get top losers"""
        query = {
            "size": limit,
            "sort": [{"percent_change_24h": "asc"}]
        }
        result = es_query("crypto_latest", query)
        hits = result.get("hits", {}).get("hits", [])
        return [hit["_source"] for hit in hits]

    @app.get("/api/alerts")
    def get_alerts(limit: int = 100, alert_type: str = None):
        """Get alerts"""
        if alert_type:
            query = {"size": limit, "query": {"term": {"alert_type": alert_type}}}
        else:
            query = {"size": limit, "sort": [{"timestamp": "desc"}]}
        result = es_query("alerts", query)
        hits = result.get("hits", {}).get("hits", [])
        return [hit["_source"] for hit in hits]

    if __name__ == "__main__":
        import uvicorn
        uvicorn.run(app, host="0.0.0.0", port=8000)
