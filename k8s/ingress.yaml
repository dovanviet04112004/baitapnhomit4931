apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: crypto-pipeline-ingress
  namespace: crypto-pipeline
  annotations:
    kubernetes.io/ingress.class: "nginx"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  tls:
  - hosts:
    - kibana.yourdomain.com
    - api.yourdomain.com
    secretName: crypto-pipeline-tls
  rules:
  - host: kibana.yourdomain.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: kibana
            port:
              number: 5601
  - host: api.yourdomain.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: query-api
            port:
              number: 8000
