apiVersion: batch/v1
kind: CronJob
metadata:
  name: spark-export-gcs
  namespace: crypto-pipeline
spec:
  # Run daily at 2 AM (after aggregation completes at 1 AM)
  schedule: "0 2 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels:
            app: spark-export-gcs
        spec:
          serviceAccountName: kafka-to-gcs
          restartPolicy: OnFailure
          containers:
          - name: spark-export
            image: gcr.io/crypto-project-bigdata/spark-batch-gcs:latest
            imagePullPolicy: Always
            command:
            - /opt/spark/bin/spark-submit
            - --master
            - local[2]
            - --driver-memory
            - 2g
            - --packages
            - org.postgresql:postgresql:42.6.0,org.elasticsearch:elasticsearch-spark-30_2.12:8.11.0
            - /app/export_metrics.py
            env:
            - name: GCS_BUCKET_NAME
              value: "crypto-pipeline-data"
            - name: POSTGRES_HOST
              value: "postgres.crypto-pipeline.svc.cluster.local"
            - name: POSTGRES_PORT
              value: "5432"
            - name: POSTGRES_DB
              value: "crypto_analytics"
            - name: POSTGRES_USER
              value: "postgres"
            - name: POSTGRES_PASSWORD
              value: "postgres"
            - name: ES_NODES
              value: "elasticsearch.crypto-pipeline.svc.cluster.local"
            - name: ES_PORT
              value: "9200"
            - name: GOOGLE_APPLICATION_CREDENTIALS
              value: "/var/secrets/google/key.json"
            volumeMounts:
            - name: gcs-credentials
              mountPath: /var/secrets/google
              readOnly: true
            resources:
              requests:
                memory: "2Gi"
                cpu: "1000m"
              limits:
                memory: "4Gi"
                cpu: "2000m"
          volumes:
          - name: gcs-credentials
            secret:
              secretName: gcs-credentials
