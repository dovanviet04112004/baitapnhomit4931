# Spark Job: Clean & Process Crypto Data
# Đọc từ Kafka → Clean → Ghi vào Elasticsearch
apiVersion: batch/v1
kind: Job
metadata:
  name: spark-clean-process
  namespace: crypto-pipeline
  labels:
    app: spark-processing
spec:
  backoffLimit: 2
  template:
    metadata:
      labels:
        app: spark-processing
    spec:
      restartPolicy: OnFailure
      securityContext:
        runAsUser: 0  # Run as root to avoid permission issues
      containers:
      - name: spark-submit
        image: apache/spark:3.5.0
        command: ["/bin/bash", "-c"]
        args:
        - |
          set -e
          echo "[$(date)] Starting Spark Clean & Process Job..."
          
          # Install Python packages
          pip install kafka-python requests pyspark --quiet
          
          # Create Spark processing script
          cat > /tmp/spark_clean.py << 'PYEOF'
          from pyspark.sql import SparkSession
          from pyspark.sql.functions import *
          from pyspark.sql.types import *
          import requests
          import json
          
          # Config
          KAFKA_SERVERS = "kafka-headless:9092"
          KAFKA_TOPIC = "raw_crypto"
          ES_HOST = "http://elasticsearch:9200"
          ES_INDEX = "crypto_latest"
          
          print("=" * 60)
          print("🚀 SPARK CRYPTO DATA CLEANING & PROCESSING")
          print("=" * 60)
          
          # Create Spark Session
          spark = SparkSession.builder \
              .appName("CryptoCleanProcess") \
              .master("spark://spark-master:7077") \
              .config("spark.jars.packages", "org.apache.spark:spark-sql-kafka-0-10_2.12:3.5.0") \
              .config("spark.executor.memory", "1g") \
              .config("spark.executor.cores", "1") \
              .getOrCreate()
          
          spark.sparkContext.setLogLevel("WARN")
          print("✅ Spark Session created")
          
          # Define schema for raw crypto data
          schema = StructType([
              StructField("crawl_time", StringType(), True),
              StructField("source", StringType(), True),
              StructField("coin_id", StringType(), True),
              StructField("symbol", StringType(), True),
              StructField("name", StringType(), True),
              StructField("current_price", DoubleType(), True),
              StructField("market_cap", DoubleType(), True),
              StructField("market_cap_rank", IntegerType(), True),
              StructField("total_volume", DoubleType(), True),
              StructField("price_change_24h", DoubleType(), True),
              StructField("price_change_percentage_24h", DoubleType(), True),
              StructField("circulating_supply", DoubleType(), True),
              StructField("high_24h", DoubleType(), True),
              StructField("low_24h", DoubleType(), True)
          ])
          
          # Read from Kafka (batch mode - earliest to latest)
          print("📥 Reading from Kafka...")
          df = spark.read \
              .format("kafka") \
              .option("kafka.bootstrap.servers", KAFKA_SERVERS) \
              .option("subscribe", KAFKA_TOPIC) \
              .option("startingOffsets", "earliest") \
              .option("endingOffsets", "latest") \
              .load()
          
          # Parse JSON
          df_parsed = df.select(
              from_json(col("value").cast("string"), schema).alias("data")
          ).select("data.*")
          
          print(f"✅ Read {df_parsed.count()} raw records")
          
          # Clean & Transform
          print("🧹 Cleaning data...")
          df_clean = df_parsed \
              .filter(col("symbol").isNotNull()) \
              .filter(col("current_price") > 0) \
              .withColumn("symbol", upper(col("symbol"))) \
              .withColumnRenamed("current_price", "price") \
              .withColumnRenamed("total_volume", "volume") \
              .withColumnRenamed("crawl_time", "timestamp") \
              .withColumn("change_24h", round(col("price_change_percentage_24h"), 2)) \
              .select(
                  "symbol",
                  "name", 
                  "price",
                  "market_cap",
                  "volume",
                  "change_24h",
                  "market_cap_rank",
                  "circulating_supply",
                  "high_24h",
                  "low_24h",
                  "timestamp"
              ) \
              .dropDuplicates(["symbol"]) \
              .orderBy(col("market_cap_rank"))
          
          clean_count = df_clean.count()
          print(f"✅ Cleaned {clean_count} unique coins")
          
          # Convert to JSON and index to Elasticsearch
          print("📤 Indexing to Elasticsearch...")
          
          data_list = df_clean.collect()
          success = 0
          
          for row in data_list:
              try:
                  doc = row.asDict()
                  symbol = doc['symbol']
                  
                  url = f"{ES_HOST}/{ES_INDEX}/_doc/{symbol}"
                  resp = requests.put(
                      url, 
                      json=doc,
                      headers={'Content-Type': 'application/json'},
                      timeout=10
                  )
                  
                  if resp.status_code in [200, 201]:
                      success += 1
                  else:
                      print(f"⚠️  Error indexing {symbol}: {resp.status_code}")
              except Exception as e:
                  print(f"⚠️  Error: {e}")
          
          print("=" * 60)
          print(f"✅ SUCCESS: Indexed {success}/{clean_count} documents")
          print("=" * 60)
          
          spark.stop()
          PYEOF
          
          # Submit to Spark cluster
          /opt/spark/bin/spark-submit \
              --master spark://spark-master:7077 \
              --deploy-mode client \
              --conf spark.executor.memory=1g \
              --conf spark.executor.cores=1 \
              --conf spark.dynamicAllocation.enabled=false \
              --conf spark.shuffle.service.enabled=false \
              --packages org.apache.spark:spark-sql-kafka-0-10_2.12:3.5.0 \
              /tmp/spark_clean.py
          
          echo "[$(date)] Job completed!"
        env:
        - name: PYTHONUNBUFFERED
          value: "1"
        resources:
          requests:
            memory: "1Gi"
            cpu: "500m"
          limits:
            memory: "2Gi"
            cpu: "1000m"
