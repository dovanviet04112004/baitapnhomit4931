---
# Spark Structured Streaming - Real-time Analytics
# Đọc từ Kafka crypto-raw → Xử lý → Gửi vào topics: alerts, market_sentiment, clean_crypto
apiVersion: apps/v1
kind: Deployment
metadata:
  name: spark-streaming
  namespace: crypto-pipeline
  labels:
    app: spark-streaming
    component: stream-processing
spec:
  replicas: 1
  selector:
    matchLabels:
      app: spark-streaming
  template:
    metadata:
      labels:
        app: spark-streaming
        component: stream-processing
    spec:
      enableServiceLinks: false
      
      containers:
      - name: spark-streaming
        image: gcr.io/crypto-project-bigdata/spark-streaming:latest
        imagePullPolicy: Always
        
        command: ["/opt/spark/bin/spark-submit"]
        args:
        - --master
        - local[2]
        - --packages
        - org.apache.spark:spark-sql-kafka-0-10_2.12:3.4.1
        - --conf
        - spark.sql.streaming.checkpointLocation=/tmp/checkpoints
        - /app/streaming_processing.py
        
        env:
        - name: KAFKA_BOOTSTRAP_SERVERS
          value: "kafka:9092"
        - name: KAFKA_TOPIC
          value: "crypto-raw"
        - name: PYTHONUNBUFFERED
          value: "1"
        
        resources:
          requests:
            memory: "2Gi"
            cpu: "1000m"
          limits:
            memory: "4Gi"
            cpu: "2000m"
        
        volumeMounts:
        - name: checkpoint-dir
          mountPath: /tmp/checkpoints
        
        # Liveness probe - check if Python/Java process is running
        livenessProbe:
          exec:
            command:
            - sh
            - -c
            - "ps aux | grep -v grep | grep -E '(spark-submit|streaming_processing)'"
          initialDelaySeconds: 60
          periodSeconds: 30
          timeoutSeconds: 10
          failureThreshold: 5
        
        # Readiness probe - check if process is running (more lenient)
        readinessProbe:
          exec:
            command:
            - sh
            - -c
            - "ps aux | grep -v grep | grep -E '(python|java)' | wc -l | grep -v '^0$'"
          initialDelaySeconds: 90
          periodSeconds: 30
          timeoutSeconds: 10
          failureThreshold: 5
      
      volumes:
      - name: checkpoint-dir
        emptyDir: {}
      
      restartPolicy: Always
