---
# Spark Structured Streaming - Real-time Analytics
# Đọc từ Kafka crypto-raw → Xử lý → Gửi vào topics: alerts, market_sentiment, clean_crypto
apiVersion: apps/v1
kind: Deployment
metadata:
  name: spark-streaming
  namespace: crypto-pipeline
  labels:
    app: spark-streaming
    component: stream-processing
spec:
  replicas: 1
  selector:
    matchLabels:
      app: spark-streaming
  template:
    metadata:
      labels:
        app: spark-streaming
        component: stream-processing
    spec:
      enableServiceLinks: false
      
      containers:
      - name: spark-streaming
        image: gcr.io/crypto-project-bigdata/spark-streaming:latest
        imagePullPolicy: Always
        
        command: ["/opt/spark/bin/spark-submit"]
        args:
        - --master
        - local[2]
        - --packages
        - org.apache.spark:spark-sql-kafka-0-10_2.12:3.4.1
        - --conf
        - spark.sql.streaming.checkpointLocation=/checkpoints
        - --conf
        - spark.metrics.namespace=crypto_streaming
        - /app/streaming_processing.py
        
        env:
        - name: KAFKA_BOOTSTRAP_SERVERS
          value: "kafka:9092"
        - name: KAFKA_TOPIC
          value: "crypto-raw"
        - name: PYTHONUNBUFFERED
          value: "1"
        - name: SPARK_METRICS_NAMESPACE
          value: "crypto_streaming"
        
        resources:
          requests:
            memory: "2Gi"
            cpu: "1000m"
          limits:
            memory: "4Gi"
            cpu: "2000m"
        
        volumeMounts:
        - name: checkpoint-dir
          mountPath: /checkpoints
        
        # Liveness probe - check if Spark process is running
        # Tăng thời gian để tránh restart khi xử lý batch lớn
        livenessProbe:
          exec:
            command:
            - sh
            - -c
            - "ps aux | grep -v grep | grep -E '(spark-submit|streaming_processing)'"
          initialDelaySeconds: 120  # Tăng từ 60s
          periodSeconds: 60         # Giảm tần suất check từ 30s
          timeoutSeconds: 15        # Tăng timeout
          failureThreshold: 10      # Cho phép fail nhiều hơn trước khi restart
        
        # Readiness probe - check if process is running (more lenient)
        readinessProbe:
          exec:
            command:
            - sh
            - -c
            - "ps aux | grep -v grep | grep -E '(python|java)' | wc -l | grep -v '^0$'"
          initialDelaySeconds: 120  # Tăng từ 90s
          periodSeconds: 45         # Giảm tần suất check
          timeoutSeconds: 15
          failureThreshold: 8       # Tăng tolerance
      
      volumes:
      - name: checkpoint-dir
        persistentVolumeClaim:
          claimName: spark-streaming-checkpoint
      
      restartPolicy: Always
