apiVersion: apps/v1
kind: Deployment
metadata:
  name: spark-worker
  namespace: crypto-pipeline
  labels:
    app: spark
    role: worker
spec:
  replicas: 2
  selector:
    matchLabels:
      app: spark
      role: worker
  template:
    metadata:
      labels:
        app: spark
        role: worker
    spec:
      enableServiceLinks: false
      containers:
      - name: spark-worker
        image: apache/spark:3.5.0
        imagePullPolicy: IfNotPresent
        command: ["/bin/bash", "-lc"]
        args:
          - |
            unset SPARK_WORKER_PORT
            unset SPARK_WORKER_WEBUI_PORT
            unset SPARK_WORKER_SERVICE_HOST
            unset SPARK_WORKER_SERVICE_PORT
            unset SPARK_WORKER_SERVICE_PORT_WEBUI
            exec /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker \
              --webui-port 8081 \
              spark://spark-master:7077
        ports:
        - containerPort: 8081
          name: webui
        env:
        - name: SPARK_WORKER_MEMORY
          value: "2g"
        - name: SPARK_WORKER_CORES
          value: "2"
        resources:
          requests:
            memory: "2Gi"
            cpu: "500m"
          limits:
            memory: "4Gi"
            cpu: "2000m"
        volumeMounts:
        - name: spark-data
          mountPath: /opt/spark/work
      volumes:
      - name: spark-data
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: spark-worker
  namespace: crypto-pipeline
  labels:
    app: spark
    role: worker
spec:
  type: ClusterIP
  ports:
  - port: 8081
    targetPort: 8081
    name: webui
  selector:
    app: spark
    role: worker
