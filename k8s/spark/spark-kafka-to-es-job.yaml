# Spark Job: Kafka → Elasticsearch (Direct)
# Đơn giản hóa: Đọc từ Kafka và ghi trực tiếp vào ES, bỏ qua HDFS
apiVersion: batch/v1
kind: Job
metadata:
  name: spark-kafka-to-es
  namespace: crypto-pipeline
  labels:
    app: spark-job
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        app: spark-job
    spec:
      restartPolicy: OnFailure
      containers:
      - name: spark-submit
        image: apache/spark:3.5.0
        command: ["/bin/bash", "-c"]
        args:
        - |
          # Install Python packages
          pip install kafka-python elasticsearch requests --quiet
          
          # Create simple Kafka → ES script
          cat > /tmp/kafka_to_es.py << 'SCRIPT'
          from kafka import KafkaConsumer
          from elasticsearch import Elasticsearch
          import json
          import time
          
          # Config
          KAFKA_SERVERS = ["kafka-headless:9092"]
          KAFKA_TOPIC = "raw_crypto"
          ES_HOST = "http://elasticsearch:9200"
          ES_INDEX = "crypto_latest"
          
          print(f"[{time.strftime('%Y-%m-%d %H:%M:%S')}] Starting Kafka → ES sync...")
          
          # Connect Elasticsearch
          es = Elasticsearch([ES_HOST])
          print(f"✅ Connected to Elasticsearch: {ES_HOST}")
          
          # Connect Kafka
          consumer = KafkaConsumer(
              KAFKA_TOPIC,
              bootstrap_servers=KAFKA_SERVERS,
              value_deserializer=lambda x: json.loads(x.decode('utf-8')),
              auto_offset_reset='earliest',
              consumer_timeout_ms=30000  # Stop after 30s idle
          )
          print(f"✅ Connected to Kafka topic: {KAFKA_TOPIC}")
          
          count = 0
          for message in consumer:
              try:
                  data = message.value
                  doc_id = data.get('symbol', data.get('coin_id'))
                  
                  # Index to ES (upsert by symbol)
                  es.index(index=ES_INDEX, id=doc_id, document=data)
                  count += 1
                  
                  if count % 10 == 0:
                      print(f"✅ Indexed {count} documents...")
              except Exception as e:
                  print(f"❌ Error: {e}")
          
          print(f"[{time.strftime('%Y-%m-%d %H:%M:%S')}] Completed! Total: {count} documents")
          SCRIPT
          
          # Run script
          python /tmp/kafka_to_es.py
        env:
        - name: PYTHONUNBUFFERED
          value: "1"
        resources:
          requests:
            memory: "512Mi"
            cpu: "200m"
          limits:
            memory: "1Gi"
            cpu: "500m"
