apiVersion: apps/v1
kind: Deployment
metadata:
  name: crypto-webapp
  namespace: crypto-pipeline
  labels:
    app: crypto-webapp
spec:
  replicas: 2
  selector:
    matchLabels:
      app: crypto-webapp
  template:
    metadata:
      labels:
        app: crypto-webapp
    spec:
      containers:
      - name: webapp
        image: gcr.io/crypto-project-bigdata/crypto-webapp:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8000
          name: http
        env:
        - name: DB_HOST
          value: "postgres.crypto-pipeline.svc.cluster.local"
        - name: DB_PORT
          value: "5432"
        - name: DB_NAME
          value: "crypto_analytics"
        - name: DB_USER
          value: "postgres"
        - name: DB_PASSWORD
          value: "postgres"
        resources:
          requests:
            memory: "256Mi"
            cpu: "200m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: crypto-webapp
  namespace: crypto-pipeline
  labels:
    app: crypto-webapp
spec:
  type: LoadBalancer
  selector:
    app: crypto-webapp
  ports:
  - name: http
    protocol: TCP
    port: 80
    targetPort: 8000
