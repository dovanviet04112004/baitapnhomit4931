# Kafka Topics Creation Job
apiVersion: batch/v1
kind: Job
metadata:
  name: kafka-topics-setup
  namespace: crypto-pipeline
spec:
  template:
    spec:
      containers:
      - name: kafka-topics
        image: confluentinc/cp-kafka:7.5.0
        command:
        - /bin/bash
        - -c
        - |
          echo "Waiting for Kafka to be ready..."
          sleep 30
          
          echo "Creating topics..."
          
          # Topic: raw_crypto
          kafka-topics --create --if-not-exists \
            --bootstrap-server kafka-headless:9092 \
            --topic raw_crypto \
            --partitions 3 \
            --replication-factor 3
          
          # Topic: clean_crypto
          kafka-topics --create --if-not-exists \
            --bootstrap-server kafka-headless:9092 \
            --topic clean_crypto \
            --partitions 3 \
            --replication-factor 3
          
          # Topic: alerts
          kafka-topics --create --if-not-exists \
            --bootstrap-server kafka-headless:9092 \
            --topic alerts \
            --partitions 3 \
            --replication-factor 3
          
          echo "Topics created successfully!"
          kafka-topics --list --bootstrap-server kafka-headless:9092
      restartPolicy: OnFailure
  backoffLimit: 3
