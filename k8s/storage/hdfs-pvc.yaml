---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: hdfs-data-pvc
  namespace: crypto-pipeline
  labels:
    app: hdfs
    component: storage
spec:
  accessModes:
    - ReadWriteOnce  # RWO: Chỉ 1 pod có thể mount (read/write)
  resources:
    requests:
      storage: 10Gi  # Yêu cầu 10GB storage
  storageClassName: standard-rwo  # Sử dụng default StorageClass
