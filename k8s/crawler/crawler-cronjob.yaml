# Crypto Crawler CronJob - Chạy mỗi phút
apiVersion: batch/v1
kind: CronJob
metadata:
  name: crypto-crawler
  namespace: crypto-pipeline
  labels:
    app: crypto-crawler
spec:
  schedule: "*/1 * * * *"  # Mỗi phút
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        spec:
          containers:
          - name: crawler
            image: python:3.11-slim
            command:
            - /bin/bash
            - -c
            - |
              pip install requests kafka-python --quiet
              python /app/crawler.py
            env:
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: "kafka-headless:9092"
            - name: COINGECKO_API_URL
              value: "https://api.coingecko.com/api/v3"
            volumeMounts:
            - name: crawler-script
              mountPath: /app
            resources:
              requests:
                memory: "128Mi"
                cpu: "100m"
              limits:
                memory: "256Mi"
                cpu: "200m"
          volumes:
          - name: crawler-script
            configMap:
              name: crawler-script
          restartPolicy: OnFailure
---
# ConfigMap chứa crawler script
apiVersion: v1
kind: ConfigMap
metadata:
  name: crawler-script
  namespace: crypto-pipeline
data:
  crawler.py: |
    import os
    import json
    import time
    from datetime import datetime
    import requests
    from kafka import KafkaProducer

    KAFKA_SERVERS = os.environ.get('KAFKA_BOOTSTRAP_SERVERS', 'kafka-headless:9092')
    API_URL = os.environ.get('COINGECKO_API_URL', 'https://api.coingecko.com/api/v3')

    def get_crypto_data():
        """Fetch top 100 coins from CoinGecko"""
        url = f"{API_URL}/coins/markets"
        params = {
            'vs_currency': 'usd',
            'order': 'market_cap_desc',
            'per_page': 100,
            'page': 1,
            'sparkline': 'false'
        }
        
        try:
            response = requests.get(url, params=params, timeout=30)
            response.raise_for_status()
            return response.json()
        except Exception as e:
            print(f"Error fetching data: {e}")
            return []

    def main():
        print(f"[{datetime.now()}] Starting crypto crawler...")
        
        # Initialize Kafka producer
        producer = KafkaProducer(
            bootstrap_servers=KAFKA_SERVERS.split(','),
            value_serializer=lambda v: json.dumps(v).encode('utf-8'),
            retries=3
        )
        
        # Fetch data
        coins = get_crypto_data()
        
        if not coins:
            print("No data fetched!")
            return
        
        # Send to Kafka
        crawl_time = datetime.utcnow().isoformat() + 'Z'
        
        for coin in coins:
            message = {
                'crawl_time': crawl_time,
                'source': 'coingecko',
                'coin_id': coin.get('id'),
                'symbol': coin.get('symbol', '').upper(),
                'name': coin.get('name'),
                'current_price': coin.get('current_price'),
                'market_cap': coin.get('market_cap'),
                'market_cap_rank': coin.get('market_cap_rank'),
                'total_volume': coin.get('total_volume'),
                'price_change_24h': coin.get('price_change_24h'),
                'price_change_percentage_24h': coin.get('price_change_percentage_24h'),
                'circulating_supply': coin.get('circulating_supply'),
                'high_24h': coin.get('high_24h'),
                'low_24h': coin.get('low_24h')
            }
            
            producer.send('raw_crypto', value=message)
        
        producer.flush()
        print(f"[{datetime.now()}] Sent {len(coins)} coins to Kafka")

    if __name__ == '__main__':
        main()
