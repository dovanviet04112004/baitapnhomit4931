<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crypto Analytics Dashboard</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <header class="header">
            <div class="header-content">
                <div class="logo">
                    <div class="logo-icon">₿</div>
                    <h1>Crypto Analytics</h1>
                </div>
                <div class="header-stats">
                    <div class="stat-item">
                        <span class="stat-label">Total Coins</span>
                        <span class="stat-value" id="totalCoins">-</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-label">Last Updated</span>
                        <span class="stat-value" id="lastUpdated">-</span>
                    </div>
                </div>
            </div>
        </header>

        <!-- Timeframe Tabs -->
        <div class="tabs">
            <button class="tab-btn active" data-timeframe="daily">
                <span class="tab-icon">📅</span>
                Daily Metrics
            </button>
            <button class="tab-btn" data-timeframe="weekly">
                <span class="tab-icon">📊</span>
                Weekly Metrics
            </button>
            <button class="tab-btn" data-timeframe="monthly">
                <span class="tab-icon">📈</span>
                Monthly Metrics
            </button>
        </div>

        <!-- Dashboard Content -->
        <main class="dashboard">
            <!-- Summary Cards -->
            <div class="summary-cards">
                <div class="card summary-card">
                    <div class="card-icon green">📈</div>
                    <div class="card-content">
                        <h3>Top Gainer</h3>
                        <p class="card-value" id="topGainer">-</p>
                        <p class="card-change positive" id="topGainerChange">-</p>
                    </div>
                </div>
                <div class="card summary-card">
                    <div class="card-icon red">📉</div>
                    <div class="card-content">
                        <h3>Top Loser</h3>
                        <p class="card-value" id="topLoser">-</p>
                        <p class="card-change negative" id="topLoserChange">-</p>
                    </div>
                </div>
                <div class="card summary-card">
                    <div class="card-icon blue">💎</div>
                    <div class="card-content">
                        <h3>Most Volatile</h3>
                        <p class="card-value" id="mostVolatile">-</p>
                        <p class="card-change" id="mostVolatileValue">-</p>
                    </div>
                </div>
                <div class="card summary-card">
                    <div class="card-icon purple">💰</div>
                    <div class="card-content">
                        <h3>Highest Volume</h3>
                        <p class="card-value" id="highestVolume">-</p>
                        <p class="card-change" id="highestVolumeValue">-</p>
                    </div>
                </div>
            </div>

            <!-- Charts Section -->
            <div class="charts-grid">
                <div class="card chart-card">
                    <div class="card-header">
                        <h3>Price Performance</h3>
                        <div class="chart-legend" id="priceChartLegend"></div>
                    </div>
                    <div class="chart-container">
                        <canvas id="priceChart"></canvas>
                    </div>
                </div>

                <div class="card chart-card">
                    <div class="card-header">
                        <h3>Volume Analysis</h3>
                    </div>
                    <div class="chart-container">
                        <canvas id="volumeChart"></canvas>
                    </div>
                </div>
            </div>

            <!-- Top Movers Table -->
            <div class="card table-card">
                <div class="card-header">
                    <h3>Top Movers</h3>
                    <div class="table-controls">
                        <button class="filter-btn active" data-filter="all">All</button>
                        <button class="filter-btn" data-filter="gainers">Gainers</button>
                        <button class="filter-btn" data-filter="losers">Losers</button>
                    </div>
                </div>
                <div class="table-container">
                    <table class="data-table">
                        <thead>
                            <tr>
                                <th>Rank</th>
                                <th>Coin</th>
                                <th>Symbol</th>
                                <th>Open Price</th>
                                <th>Close Price</th>
                                <th>High</th>
                                <th>Low</th>
                                <th>Return %</th>
                                <th>Volatility %</th>
                                <th>Volume</th>
                            </tr>
                        </thead>
                        <tbody id="tableBody">
                            <!-- Data will be populated by JavaScript -->
                        </tbody>
                    </table>
                </div>
            </div>
        </main>

        <!-- Loading Overlay -->
        <div class="loading-overlay" id="loadingOverlay">
            <div class="spinner"></div>
            <p>Loading data...</p>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
